name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported Cobblemon for 1.21.1 plus the newer releases, so API drift is caught.
        cobblemon: ['1.6.1+1.21.1', '1.7.3+1.21.1', '1.8.3+1.21.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace -Pcobblemon_version=${{ matrix.cobblemon }}
      - name: Server smoke test
        # Boots a dedicated server with Cobblemon to catch registry, recipe and loot modifier errors.
        run: |
          mkdir -p run && echo 'eula=true' > run/eula.txt
          ./gradlew runServer -Pcobblemon_version=${{ matrix.cobblemon }} > server.log 2>&1 &
          for i in $(seq 1 120); do
            grep -q 'Done (' server.log && break
            if ! kill -0 $! 2>/dev/null; then break; fi
            sleep 5
          done
          pkill -f 'net.neoforged' || true
          grep -E 'Done \(' server.log || true
          # Only our own errors count; Cobblemon ships optional compat data that logs errors when those mods are absent.
          grep -E 'ERROR|Exception|Failed to|Couldn.t' server.log | grep -i 'cobblemonranger' && exit 1
          grep -q 'Done (' server.log || { tail -100 server.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: cobblemon-ranger-${{ strategy.job-index }}
          path: build/libs/*.jar

  binary-compat:
    # The release jar is compiled against the oldest Cobblemon; make sure it still links against the newer ones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release jar
        run: ./gradlew build --stacktrace
      - name: Check against newer Cobblemon releases
        run: |
          # The first jar is the one the mod is compiled against (gradle.properties), used as the baseline.
          for v in 1.6.1 1.7.3 1.8.1 1.8.3; do
            curl -sSfL -o cobblemon-$v.jar "https://maven.impactdev.net/repository/development/com/cobblemon/neoforge/$v%2B1.21.1/neoforge-$v%2B1.21.1.jar"
          done
          python3 tools/check_cobblemon_compat.py build/libs/cobblemonranger-*.jar cobblemon-1.6.1.jar cobblemon-1.7.3.jar cobblemon-1.8.1.jar cobblemon-1.8.3.jar
