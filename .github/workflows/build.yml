name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported Cobblemon for 1.21.1 plus the newer releases, so API drift is caught.
        cobblemon: ['1.6.1+1.21.1', '1.7.3+1.21.1', '1.8.3+1.21.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace -Pcobblemon_version=${{ matrix.cobblemon }}
      - uses: actions/upload-artifact@v4
        with:
          name: cobblemon-ranger-${{ strategy.job-index }}
          path: build/libs/*.jar
